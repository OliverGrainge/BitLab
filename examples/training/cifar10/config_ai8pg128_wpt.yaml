# Training Configuration for ResNet18 with BitConv2d on CIFAR-10
# Quantization: ai8pg128_wpt (Per-group-128 activation, Per-tensor weight)

# Run settings
run_name: "ai8pg128_wpt"
wandb_project: "bitlab-bitconv-cifar10-imageclass"
wandb_entity: null  # Set to your wandb username if needed

# Model settings
layer_type: "bitconv"
quant_type: "ai8pg128_wpt"

# Training settings
num_epochs: 200
batch_size: 128
num_workers: 2
seed: 42

# Optimizer settings
learning_rate: 0.1
momentum: 0.9
weight_decay: 0.0005  # 5e-4

# Scheduler settings
scheduler: "cosine"  # Cosine annealing

# Data settings
data_root: "../../data"
num_classes: 10

# Device settings
device: "auto"  # "auto", "cuda", or "cpu"

