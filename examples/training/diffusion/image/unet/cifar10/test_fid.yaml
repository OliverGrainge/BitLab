# tiny_fid_test.yaml
run_name: "tiny-fid-smoke"
wandb_project: "bitlab-cifar10-test"
wandb_entity: null

# Trainer - run 1 training step and trigger validation immediately
max_steps: 1
accelerator: "auto"
devices: 1                # set to 1 GPU if available; "cpu" will also work
precision: "32"          # keep fp32 for quick smoke tests
grad_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 1
validate_every_n_steps: 1

# Data
train_batch_size: 4
val_batch_size: 8
num_workers: 0
val_split: 0.01
seed: 42

# Optimizer (keeps defaults small)
optimizer: "adamw"
learning_rate: 2e-4
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1e-8

# LR scheduler - not important for smoke test
lr_scheduler: "constant"
lr_warmup_steps: 0
max_lr_steps: 1

# Diffusion - keep timesteps small to speed sampling
beta_schedule: "cosine"
beta_start: 1e-4
beta_end: 0.02
num_timesteps: 100       # small but fine for a quick smoke
loss_type: "l2"
prediction_type: "epsilon"

# EMA - keep enabled if your code supports it
use_ema: false
ema_decay: 0.9999

# Sampling - tiny sample set for quick FID eval
num_sample_steps: 10     # fast DDIM / DDPM sampling
sample_every_n_steps: 1
num_samples: 16          # VERY small -- only for smoke tests

# Logging
grad_norm_log_every_n_steps: 1
weight_histogram_log_every_n_epochs: 1
sample_log_every_n_epochs: 1

# Model - minimal small network to reduce memory & compute
model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  model_channels: 64       # small
  attention_resolutions: [] # disable attention for speed
  num_heads: 1
  num_res_blocks: 1
  channel_mult: [1, 1, 1, 1]
  dropout: 0.0
  quant_type: "none"

# FIDCallback specific quick-test settings (match your callback args)
fid_every_n_epochs: 1
fid_every_n_steps: null
sample_batch_size: 8
fid_batch_size: 8
sample_batch_size: 8
sample_batch_size: 8
sample_every_n_steps: 1

# FIDCallback behaviour:
# - compute real stats on the small validation set (fast)
# - save stats to a local file so repeated runs are faster
# NOTE: your code may accept stats_path; set to null to compute from val loader
fid:
  stats_path: null            # compute real stats from val loader (quick)
  max_real_samples: 512       # small: limits how many real samples used to compute stats
  cleanup_after: true         # if your callback supports it, remove temporary images
  compute_inception_score: false