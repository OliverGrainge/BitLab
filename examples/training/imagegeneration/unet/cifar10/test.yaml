seed: 42
# =========================
# Experiment / logging
# =========================
experiment:
  run_name: "full-precision-baseline"
  wandb_project: "bitlab-cifar10"

# =========================
# Trainer
# =========================
trainer:
  max_steps: 800000          # Extended training for better convergence
  accelerator: "auto"
  devices: "auto"
  precision: "bf16-mixed"
  grad_clip_val: 1.0
  accumulate_grad_batches: 4  # Effective batch size = 256 * 2 = 512
  log_every_n_steps: 1000
  validate_every_n_steps: 5000

# =========================
# Data
# =========================
data:
  train_batch_size: 64        # Reduce if OOM
  val_batch_size: 64
  num_workers: 8
  val_split: 0.02


# =========================
# Optimizer
# =========================
optimizer:
  name: "adamw"
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

# =========================
# LR Scheduler
# =========================
scheduler:
  name: "cosine"              # "constant", "linear", or "cosine"
  warmup_steps: 5000
  max_steps: 800000

# =========================
# Diffusion
# =========================
diffusion:
  beta_schedule: "cosine"     # Better for image generation
  beta_start: 0.0001          # Kept for compatibility
  beta_end: 0.02              # Kept for compatibility
  num_timesteps: 1000
  loss_type: "l2"
  prediction_type: "epsilon"  # Or "v"

# =========================
# EMA
# =========================
ema:
  enabled: true
  decay: 0.9999

# =========================
# Sampling
# =========================
sampling:
  num_sample_steps: 100              # For DDIM FID evaluation
  num_samples: 16             # Default batch for logging / sampling

# =========================
# Logging / callbacks
# =========================
logging:
  grad_norm:
    every_n_steps: 500

  weight_histograms:
    every_n_steps: 5000

  images:
    every_n_steps: 5000
    num_images: 16
    nrow: 4
    log_key: "train/image_grid"
    use_ema: true

  fid:
    enabled: true
    dataset: "cifar10"
    resolution: 32
    split: "test"
    mode: "clean"
    num_gen: 512
    batch_size: 64
    every_n_steps: 5000

  inception_score: 
    num_gen: 50000 
    batch_size: 64 
    every_n_steps: 5
    splits: 10
    normalize: true

# =========================
# Model
# =========================
model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  model_channels: 192
  attention_resolutions: [4, 2]
  num_heads: 6
  num_res_blocks: 3
  channel_mult: [1, 2, 2, 2]
  dropout: 0.1
  quant_type: "none"