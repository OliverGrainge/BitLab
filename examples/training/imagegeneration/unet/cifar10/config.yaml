seed: 42
# =========================
# Experiment / logging
# =========================
experiment:
  run_name: "full-precision-baseline-vpred"
  wandb_project: "bitlab-cifar10"

# =========================
# Trainer
# =========================
trainer:
  max_steps: 350000          # Fewer steps; still plenty of images for CIFAR-10
  accelerator: "auto"
  devices: "auto"
  precision: "bf16-mixed"
  grad_clip_val: 1.0
  accumulate_grad_batches: 1  # One forward/backward per step; effective batch = 64
  log_every_n_steps: 1000
  validate_every_n_steps: 5000

# =========================
# Data
# =========================
data:
  train_batch_size: 64        # Peak memory unchanged vs your old setup
  val_batch_size: 64
  num_workers: 4
  val_split: 0.02

# =========================
# Optimizer
# =========================
optimizer:
  name: "adamw"
  lr: 0.0002
  weight_decay: 0.01          # Add proper regularization for UNet
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

# =========================
# LR Scheduler
# =========================
scheduler:
  name: "cosine"              # "constant", "linear", or "cosine"
  warmup_steps: 5000
  max_steps: 350000           # Match trainer.max_steps

# =========================
# Diffusion
# =========================
diffusion:
  beta_schedule: "cosine"     # Better for image generation
  beta_start: 0.0001
  beta_end: 0.02
  num_timesteps: 1000
  loss_type: "l2"
  prediction_type: "v"        # More stable and usually better FID than epsilon

# =========================
# EMA
# =========================
ema:
  enabled: true
  decay: 0.9997               # Less extreme than 0.9999; responds faster

# =========================
# Sampling
# =========================
sampling:
  num_sample_steps: 100       # For DDIM FID evaluation
  num_samples: 16             # Default batch for logging / sampling

# =========================
# Logging / callbacks
# =========================
logging:
  grad_norm:
    every_n_steps: 500

  weight_histograms:
    every_n_steps: 10000

  images:
    every_n_steps: 5000
    num_images: 16
    nrow: 4
    log_key: "train/image_grid"
    use_ema: true


# =========================
# Model
# =========================
model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  model_channels: 128         # Smaller, more typical for CIFAR-10
  attention_resolutions: [4, 2]
  num_heads: 6
  num_res_blocks: 2           # Standard; cheaper and sufficient
  channel_mult: [1, 2, 2, 2]
  dropout: 0.0                # Dropout usually hurts on CIFAR-10
  quant_type: "none"