# Training configuration for MNIST MLP with BitLinear layers (ai8pt_wpt)

# Run settings
run_name: "ai8pt_wpt"
wandb_project: "bitlab-mnist"
wandb_entity: null

# Trainer settings
max_epochs: 20
accelerator: "auto"
devices: "auto"
precision: "32-true"
grad_clip_val: 0.0
accumulate_grad_batches: 1
log_every_n_steps: 50

# Data settings
train_batch_size: 128
val_batch_size: 256
num_workers: 0
use_augmentation: false
num_classes: 10
seed: 42

# Optimizer settings
learning_rate: 0.001
weight_decay: 0.0001
optimizer: "adam"

# Learning rate scheduler settings
lr_scheduler: "constant"
lr_warmup_steps: 0

# Loss settings
loss_type: "cross_entropy"
label_smoothing: 0.0

# Metrics settings
top_k: [1]
compute_per_class_metrics: false
log_samples_every_n_epochs: 5
num_samples_to_log: 16

# Model architecture settings
model:
  quant_type: "ai8pt_wpt"
  hidden_dims: [512, 256]

