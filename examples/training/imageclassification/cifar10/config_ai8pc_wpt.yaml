# Training Configuration for ResNet18 with BitConv2d on CIFAR-10
# Quantization: ai8pc_wpt (Per-channel activation, Per-tensor weight)

# Run settings
run_name: "ai8pc_wpt"
wandb_project: "bitlab-bitconv-cifar10-imageclass"
wandb_entity: null  # Set to your wandb username if needed

# Trainer settings
max_epochs: 200
accelerator: "auto"  # Options: "auto", "gpu", "cpu", "tpu"
devices: "auto"      # Options: "auto", "1", "0,1", etc.
precision: "32-true" # Options: "32-true", "16-mixed", "bf16-mixed"
grad_clip_val: 0.0   # 0 disables gradient clipping
accumulate_grad_batches: 1
log_every_n_steps: 50

# Data settings
train_batch_size: 128
val_batch_size: 128
num_workers: 6
use_augmentation: true  # Enable data augmentation (random crop, flip)
num_classes: 10
seed: 42

# Optimizer settings
learning_rate: 0.1
weight_decay: 0.0005  # 5e-4
optimizer: "sgd"      # Options: "sgd", "adam", "adamw"
sgd_momentum: 0.9
sgd_nesterov: true

# Learning rate scheduler settings
lr_scheduler: "cosine"  # Options: "constant", "linear", "cosine"
lr_warmup_steps: 0      # No warmup for CIFAR-10

# Loss settings
loss_type: "cross_entropy"  # Options: "cross_entropy", "focal", "bce"
label_smoothing: 0.0        # Label smoothing factor

# Metrics settings
top_k: [1, 5]
compute_per_class_metrics: false
log_samples_every_n_epochs: 10
num_samples_to_log: 16

# Model architecture settings
model:
  layer_type: "bitconv"    # Options: "standard", "bitconv"
  quant_type: "ai8pc_wpt"  # Quantization scheme
