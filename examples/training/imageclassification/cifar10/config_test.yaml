# Quick test configuration for ResNet18 on CIFAR-10

# Run settings
run_name: "test"
wandb_project: "bitlab-bitconv-cifar10-imageclass"
wandb_entity: null

# Trainer settings
max_epochs: 2
accelerator: "auto"
devices: "auto"
precision: "32-true"
grad_clip_val: 0.0
accumulate_grad_batches: 1
log_every_n_steps: 50

# Data settings
train_batch_size: 128
val_batch_size: 128
num_workers: 2
use_augmentation: true
num_classes: 10
seed: 42

# Optimizer settings
learning_rate: 0.1
weight_decay: 0.0005
optimizer: "sgd"
sgd_momentum: 0.9
sgd_nesterov: true

# Scheduler settings
lr_scheduler: "cosine"
lr_warmup_steps: 0

# Loss settings
loss_type: "cross_entropy"
label_smoothing: 0.0

# Metrics settings
top_k: [1, 5]
compute_per_class_metrics: false
log_samples_every_n_epochs: 1
num_samples_to_log: 16

# Model settings
model:
  layer_type: "bitconv"
  quant_type: "ai8pc_wpt"


