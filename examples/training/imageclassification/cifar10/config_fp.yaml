# Training configuration for CIFAR-10 ResNet18 with standard Conv2d layers

# Run settings
run_name: "resnet18-fp32"
wandb_project: "bitlab-cifar10"
wandb_entity: null

# Trainer settings
max_epochs: 200
accelerator: "auto"
devices: "auto"
precision: "32-true"
grad_clip_val: 0.0
accumulate_grad_batches: 1
log_every_n_steps: 100

# Data settings
train_batch_size: 128
val_batch_size: 256
num_workers: 0
use_augmentation: true
num_classes: 10
seed: 42

# Optimizer settings
optimizer: "sgd"
learning_rate: 0.1
weight_decay: 0.0005
sgd_momentum: 0.9
sgd_nesterov: true

# Learning rate scheduler settings
lr_scheduler: "cosine"
lr_warmup_steps: 500

# Loss settings
loss_type: "cross_entropy"
label_smoothing: 0.1

# Metrics settings
top_k: [1, 5]
compute_per_class_metrics: true
log_samples_every_n_epochs: 10
num_samples_to_log: 16

# Model architecture settings
model:
  layer_type: "standard"
  quant_type: null

