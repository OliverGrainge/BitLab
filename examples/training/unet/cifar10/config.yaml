# Training Configuration for BitUNet DDPM on CIFAR10

# Trainer settings
max_steps: 100000
accelerator: "auto"  # Options: "auto", "gpu", "cpu", "tpu"
devices: "auto"      # Options: "auto", "1", "0,1", etc.
precision: "32-true" # Options: "32-true", "16-mixed", "bf16-mixed"
grad_clip_val: 0.0   # 0 disables gradient clipping
accumulate_grad_batches: 1
log_every_n_steps: 50
validate_every_n_steps: 5000  # Set to 0 to disable automatic validation

# Data settings
train_batch_size: 32
val_batch_size: 64
num_workers: 0
val_split: 0.02  # Fraction of training data to reserve for validation
seed: 42

# Optimizer settings
learning_rate: 0.0001  # 1e-4
weight_decay: 0.0
optimizer: "adamw"  # Options: "adam", "adamw"

# Diffusion settings
beta_schedule: "linear"  # Options: "linear", "cosine", "quadratic"
num_timesteps: 1000
loss_type: "l2"  # Options: "l1", "l2", "huber"
prediction_type: "epsilon"  # Options: "epsilon", "x0", "v"
use_ema: true  # Enable/disable EMA tracking

# Sampling settings
num_sample_steps: 50  # Number of DDIM sampling steps during validation
sample_every_n_steps: 1000  # How often to generate samples
num_samples: 16  # Number of samples to log when sampling

# Model architecture settings
model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  model_channels: 128
  attention_resolutions: [1, 2, 4]  # Add attention at these resolution scales
  num_heads: 4
  num_res_blocks: 3
  channel_mult: [1, 2, 2, 2]  # Channel multipliers per resolution level

