# BitDistill Stage 1: Continual Pretraining with BitLinear Quantization
# Qwen3-0.6B with MLP and attention layer quantization
# This stage uses only cross-entropy loss to adapt the quantized model to the data distribution

datamodule: 
  type: falcon-refinedweb-pt
  tokenizer_name: qwen3_06B_pt
  batch_size: 8
  num_workers: 8
  max_length: 256  # Truncate sequences to prevent OOM errors

trainer: 
  type: bitdistillpretrainer  # Stage 1: Pretraining only
  model_name: qwen3_06B_pt
  learning_rate: 1e-5
  weight_decay: 0.01
  
  # Quantization settings
  target_quant_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]  # Quantize attention and MLP layers
  target_subln_modules: ["o_proj", "down_proj"]  
  quant_type: bitnet

logger: 
  type: tensorboard 
  save_dir: logs/tensorboard/bitdistill
  name: bitdistill_qwen3_experiment  # Optional: creates subdirectory
  version: continued-pretrain-very-small-lr  # This will be the folder name instead of version_N

#logger: 
#  type: wandb
#  project: bitdistill_qwen3_06B  # WandB project name (like workspace)
#  name: continued-pretrain-1  # Run name (equivalent to TensorBoard's version)
#  save_dir: logs/wandb/bitdistill_qwen3_06B  # Optional: local save directory

checkpoint: 
  monitor: train_loss 
  mode: min 
  save_top_k: 3  # Save top 3 best checkpoints (based on train_loss)
  dirpath: checkpoints/bitdistill/qwen3_06B/continued-pretrain-1
  filename: "qwen3_06B-{step}-{train_loss:.4f}"  # Include step and loss in filename
  every_n_train_steps: 2000  # Checkpoint every N training steps (adjust as needed)
  save_last: true  # 

pl_trainer: 
  max_epochs: 100  # Stage 1 typically needs fewer epochs
  accelerator: gpu 
  #devices: 2
  precision: bf16-true
  enable_progress_bar: true
  #strategy: ddp  # Use DDP for multi-GPU training
  
  # Optional: Add validation
  # val_check_interval: 0.25  # Validate 4 times per epoch
  # limit_val_batches: 100  # Limit validation to 100 batches