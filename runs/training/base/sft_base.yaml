# Base SFT (Supervised Fine-Tuning) Training Configuration
# Common settings shared across SFT experiments
# Override these in experiment-specific configs

datamodule: 
  type: alpaca-sft 
  num_workers: 0
  max_length: 1024  # Truncate sequences to prevent OOM errors

trainer: 
  type: sfttrainer
  learning_rate: 5e-5
  weight_decay: 0.01

logger: 
  type: tensorboard 

checkpoint: 
  monitor: train_loss 
  mode: min 
  save_top_k: 1
  filename: "epoch={epoch}-loss={train_loss:.4f}"

pl_trainer: 
  max_epochs: 500
  accelerator: gpu 
  devices: 1
  precision: bf16-true
