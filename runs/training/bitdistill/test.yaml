# BitDistill Stage 1: Continual Pretraining with BitLinear Quantization
# Qwen3-0.6B with MLP and attention layer quantization
# This stage uses only cross-entropy loss to adapt the quantized model to the data distribution

datamodule: 
  type: fineweb-edu-pt
  tokenizer_name: smollm2_360m_pt
  batch_size: 4
  num_workers: 4
  max_length: 512  # Truncate sequences to prevent OOM errors

trainer: 
  type: bitdistillpretrainer  # Stage 1: Pretraining only
  model_name: smollm2_360m_pt
  learning_rate: 1e-4
  weight_decay: 0.0
  
  # Quantization settings
  target_quant_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]  # Quantize attention and MLP layers
  target_subln_modules: ["o_proj", "down_proj"]  
  quant_type: bitnet_channel

  # Initialization Seetings 
  #ptq_method: null
  #calibration_samples: null
  #n_bit_ptq: null



logger: 
  type: tensorboard 
  save_dir: logs/training/bidistill
  name: smollm2_360m # Optional: creates subdirectory
  version: test  # This will be the folder name instead of version_N


checkpoint: 
  monitor: train_loss 
  mode: min #
  save_top_k: 3  # Save top 3 best checkpoints (based on train_loss)
  dirpath: checkpoints/bitdistill/smollm2_360m/test/
  filename: "test-{train_loss:.4f}"  # Include step and loss in filename
  every_n_train_steps: 2000  # Checkpoint every N training steps (adjust as needed)
  save_last: true  # 

pl_trainer: 
  # Duration: use max_epochs OR max_tokens. Tokens per step = batch_size × max_length (sequence length).
  # Here: 8 × 256 = 2048 tokens/step → 10_000_000 tokens ≈ 4882 steps.
  # max_epochs: 10  # epoch-based (ignored if max_tokens is set)
  max_tokens: 2_000_000_000  # 1B tokens
  accelerator: gpu 
  #devices: 2
  precision: bf16-true
  enable_progress_bar: false
  #strategy: ddp  # Use DDP for multi-GPU training
  
  # Optional: Add validation
  # val_check_interval: 0.25  # Validate 4 times per epoch
  # limit_val_batches: 100  # Limit validation to 100 batches